    <section class="cart-page">

        <p class="number">
            04 / CART

        <div id="cartContainer"></div>


        <section class="cart-summary" id="cartSummary">

            <div class="summary-line">

                <span>
                    ITEMS
                </span>

                <strong id="summaryItems">
                    0

            </div>


            <div class="summary-line">

                <span>
                    SUBTOTAL

                </strong>

            </div>


            <button class="checkout-button" id="checkoutButton">

                CHECKOUT →

            </button>

        </section>


        <section class="empty-cart" id="emptyCart">

            <p>
                YOUR CART IS EMPTY.

            <a href="shop.html">
                DISCOVER THE COLLECTION →

        </section>
