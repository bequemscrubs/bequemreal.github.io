<body>

<header>
    <div class="brand">BEQUEM SCRUBS</div>

    <div class="subtitle">
        MEDICAL WEAR · EST. 2026
    </div>
</header>


<main>

    <h1 class="cart-title">YOUR CART</h1>

    <div class="cart-wrapper">

        <div id="cartItems" class="cart-items"></div>

        <aside class="summary">

            <div class="summary-title">
                ORDER SUMMARY
            </div>

            <div class="summary-row">
                <span>ITEMS</span>
                <span id="summaryItems">0</span>
            </div>

            <div class="summary-total">
                <span>TOTAL</span>
                <span id="summaryTotal">0 DA</span>
            </div>

            <button
                id="checkoutBtn"
                class="checkout-btn"
                onclick="checkout()"
                disabled>
                CHECKOUT →
            </button>

        </aside>

    </div>

</main>


<div
    id="reviewOverlay"
    class="review-overlay"
    onclick="handleOverlayClick(event)"
>

    <div
        class="review-popup"
        onclick="event.stopPropagation()"
    >

        <button
            class="review-close"
            onclick="closeReview()"
            aria-label="Close">
            ×
        </button>

        <div class="review-small">
            ORDER CONFIRMED
        </div>

        <div class="review-title">
            LEAVE<br>
            A REVIEW?
        </div>

        <div class="review-buttons">

            <button
                class="review-btn yes"
                onclick="goToReviews()">
                YES →
            </button>

            <button
                class="review-btn no"
                onclick="closeReview()">
                NO
            </button>

        </div>

    </div>

</div>


<script>

const CART_KEY = "bequemCart";
const LAST_ORDER_KEY = "bequemLastOrder";

/* =========================================
   WHATSAPP NUMBER
========================================= */

const WHATSAPP_NUMBER = "213781952022";


/* =========================================
   GET CART
========================================= */

function getCart() {
    try {
        return JSON.parse(localStorage.getItem(CART_KEY)) || [];
    } catch (error) {
        return [];
    }
}


/* =========================================
   SAVE CART
========================================= */

function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
}


/* =========================================
   DISPLAY CART
========================================= */

function displayCart() {

    const cart = getCart();

    const cartItems = document.getElementById("cartItems");
    const summaryItems = document.getElementById("summaryItems");
    const summaryTotal = document.getElementById("summaryTotal");
    const checkoutBtn = document.getElementById("checkoutBtn");

    cartItems.innerHTML = "";

    if (!cart.length) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                YOUR CART IS EMPTY.
            </div>
        `;

        summaryItems.textContent = "0";
        summaryTotal.textContent = "0 DA";

        checkoutBtn.disabled = true;

        return;
    }

    let total = 0;
    let totalItems = 0;

    cart.forEach((item, index) => {

        const quantity = Number(item.quantity) || 1;
        const price = Number(item.price) || 0;

        total += price * quantity;
        totalItems += quantity;

        const image = item.image || "";

        const itemElement = document.createElement("div");

        itemElement.className = "cart-item";

        itemElement.innerHTML = `

            ${
                image
                ? `<img
                    src="${image}"
                    class="product-image"
                    alt="${item.name || "Product"}"
                   >`
                : `<div class="product-image"></div>`
            }

            <div class="product-info">

                <h3>
                    ${item.name || "PRODUCT"}
                </h3>

                ${
                    item.size
                    ? `<p>SIZE: ${item.size}</p>`
                    : ""
                }

                ${
                    item.color
                    ? `<p>COLOR: ${item.color}</p>`
                    : ""
                }

                <p>
                    QUANTITY: ${quantity}
                </p>

                <button
                    class="remove-btn"
                    onclick="removeItem(${index})">
                    REMOVE
                </button>

            </div>

            <div class="product-price">
                ${(price * quantity).toLocaleString()} DA
            </div>

        `;

        cartItems.appendChild(itemElement);

    });

    summaryItems.textContent = totalItems;
    summaryTotal.textContent =
        total.toLocaleString() + " DA";

    checkoutBtn.disabled = false;
}


/* =========================================
   REMOVE ITEM
========================================= */

function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    displayCart();
}


/* =========================================
   CHECKOUT → WHATSAPP
========================================= */

function checkout() {

    const cart = getCart();

    if (!cart.length) {
        return;
    }

    let total = 0;
    let totalItems = 0;

    /*
       CREATE WHATSAPP MESSAGE
    */

    let message =
        "🛍️ *NEW ORDER — BEQUEM SCRUBS*\n\n";

    cart.forEach((item) => {

        const quantity = Number(item.quantity) || 1;
        const price = Number(item.price) || 0;

        const itemTotal = price * quantity;

        total += itemTotal;
        totalItems += quantity;

        message +=
            "• " +
            (item.name || "PRODUCT") +
            "\n";

        if (item.size) {
            message +=
                "  Size: " + item.size + "\n";
        }

        if (item.color) {
            message +=
                "  Color: " + item.color + "\n";
        }

        message +=
            "  Quantity: " + quantity + "\n";

        message +=
            "  Price: " +
            itemTotal.toLocaleString() +
            " DA\n\n";
    });

    message +=
        "━━━━━━━━━━━━━━\n" +
        "TOTAL ITEMS: " +
        totalItems +
        "\n" +
        "TOTAL: " +
        total.toLocaleString() +
        " DA\n\n" +
        "Hello, I would like to place this order.";


    /*
       SAVE ORDER
    */

    const order = {
        items: cart,
        total: total,
        date: new Date().toISOString()
    };

    localStorage.setItem(
        LAST_ORDER_KEY,
        JSON.stringify(order)
    );


    /*
       OPEN WHATSAPP
    */

    const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    /*
       OPEN WHATSAPP IN NEW TAB
    */

    window.open(whatsappURL, "_blank");


    /*
       CLEAR CART
    */

    localStorage.removeItem(CART_KEY);

    displayCart();


    /*
       SHOW REVIEW POPUP
    */

    setTimeout(() => {
        openReview();
    }, 500);
}


/* =========================================
   OPEN REVIEW POPUP
========================================= */

function openReview() {

    const overlay =
        document.getElementById("reviewOverlay");

    overlay.classList.add("show");

    document.body.style.overflow = "hidden";
}


/* =========================================
   CLOSE REVIEW POPUP
========================================= */

function closeReview() {

    const overlay =
        document.getElementById("reviewOverlay");

    overlay.classList.remove("show");

    document.body.style.overflow = "";
}


/* =========================================
   CLICK OUTSIDE POPUP
========================================= */

function handleOverlayClick(event) {

    if (
        event.target ===
        document.getElementById("reviewOverlay")
    ) {
        closeReview();
    }
}


/* =========================================
   YES → REVIEWS
========================================= */

function goToReviews() {

    window.location.href = "reviews.html";
}


/* =========================================
   INITIAL LOAD
========================================= */

displayCart();

</script>

</body>
</html>
