<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Cart — BEQUEM SCRUBS</title>

    <link rel="stylesheet" href="cart.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <a href="index.html" class="brand">
        BEQUEM SCRUBS
    </a>


    <nav>

        <a href="index.html">
            HOME
        </a>

        <a href="shop.html">
            SHOP
        </a>

        <a href="index.html#reviews">
            REVIEWS
        </a>

        <a href="cart.html" class="active">
            CART <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<!-- ================= CART ================= -->

<section class="cart-page">

    <p class="number">
        04 / CART
    </p>


    <h1>
        YOUR<br>
        CART.
    </h1>


    <div id="cartContainer"></div>


    <!-- ================= SUMMARY ================= -->

    <section class="cart-summary" id="cartSummary">

        <div class="summary-line">

            <span>
                ITEMS
            </span>

            <strong id="summaryItems">
                0
            </strong>

        </div>


        <div class="summary-line">

            <span>
                SUBTOTAL
            </span>

            <strong id="summaryTotal">
                PRICE TO BE ADDED
            </strong>

        </div>


        <button class="checkout-button"
                id="checkoutButton">

            CHECKOUT →

        </button>

    </section>


    <!-- ================= EMPTY CART ================= -->

    <section class="empty-cart"
             id="emptyCart">

        <p>

        </p>

        <a href="shop.html">
            DISCOVER THE COLLECTION →
        </a>

    </section>

</section>

    <div class="footer-brand">
        BEQUEM SCRUBS
    </div>

    <div class="footer-bottom">

        <span>

        </span>

        </span>

</footer>

<!-- ================= JAVASCRIPT ================= -->

<script>


/*
==================================================
PANIER
==================================================
*/


const cartContainer =
    document.getElementById("cartContainer");


const cartCount =
    document.getElementById("cartCount");


const summaryItems =
    document.getElementById("summaryItems");


const summaryTotal =
    document.getElementById("summaryTotal");


const cartSummary =
    document.getElementById("cartSummary");


const emptyCart =
    document.getElementById("emptyCart");


const checkoutButton =
    document.getElementById("checkoutButton");


/*
    Récupérer le panier
*/

let cart =
    JSON.parse(
        localStorage.getItem("bequemCart") || "[]"
    );


/*
==================================================
AFFICHER LE PANIER
==================================================
*/


function displayCart() {


    cartContainer.innerHTML = "";


    /*
        Panier vide
    */

    if (cart.length === 0) {

        cartSummary.style.display = "none";

        emptyCart.style.display = "block";

        cartCount.textContent = "0";

        return;

    }


    /*
        Panier rempli
    */

    cartSummary.style.display = "block";

    emptyCart.style.display = "none";


    let totalItems = 0;


    let totalPrice = 0;


    cart.forEach(function(item, index) {


        /*
            Quantité
        */

        const quantity =
            Number(item.quantity) || 1;


        totalItems += quantity;


        /*
            Prix
        */

        const price =
            Number(
                String(item.price || "0")
                .replace(/[^\d.]/g, "")
            ) || 0;


        totalPrice += price * quantity;


        /*
            Créer l'article
        */

        const cartItem =
            document.createElement("div");


        cartItem.className =
            "cart-item";


        cartItem.innerHTML = `

            <div class="cart-item-info">

                <h3>
                    ${item.name || "BEQUEM SCRUB"}
                </h3>

                <p>
                    ${item.size ? "SIZE: " + item.size : ""}
                </p>

                <p>
                    ${item.color ? "COLOR: " + item.color : ""}
                </p>

                <p>
                    QUANTITY: ${quantity}
                </p>

            </div>


            <div class="cart-item-price">

                ${item.price || "PRICE TO BE ADDED"}

            </div>

        `;


        cartContainer.appendChild(cartItem);

    });


    /*
        Mettre à jour les informations
    */

    cartCount.textContent =
        totalItems;


    summaryItems.textContent =
        totalItems;


    if (totalPrice > 0) {

        summaryTotal.textContent =
            totalPrice.toLocaleString() + " DA";

    } else {

        summaryTotal.textContent =
            "PRICE TO BE ADDED";

    }

}


/*
==================================================
CHECKOUT
==================================================
*/


checkoutButton.addEventListener(
    "click",
    function () {


        /*
            Vérifier que le panier
            n'est pas vide
        */

        if (cart.length === 0) {

            return;

        }


        /*
            Afficher la popup
        */

        reviewPopup.classList.add("active");

    }
);


/*
==================================================
REVIEW POPUP
==================================================
*/


const reviewPopup =
    document.getElementById("reviewPopup");


const reviewYes =
    document.getElementById("reviewYes");


const reviewNo =
    document.getElementById("reviewNo");


const reviewClose =
    document.getElementById("reviewClose");


/*
    YES
*/

reviewYes.addEventListener(
    "click",
    function () {

        window.location.href =
            "reviews.html";

    }
);


/*
    NO
*/

reviewNo.addEventListener(
    "click",
    function () {

        reviewPopup.classList.remove(
            "active"
        );

    }
);


/*
    X
*/

reviewClose.addEventListener(
    "click",
    function () {

        reviewPopup.classList.remove(
            "active"
        );

    }
);


/*
    Cliquer à l'extérieur
*/

reviewPopup.addEventListener(
    "click",
    function(event) {

        if (
            event.target === reviewPopup
        ) {

            reviewPopup.classList.remove(
                "active"
            );

        }

    }
);


/*
==================================================
LANCER LE PANIER
==================================================
*/


displayCart();


</script>


</body>

</html>
