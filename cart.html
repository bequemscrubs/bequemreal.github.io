<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Cart — BEQUEM SCRUBS</title>

    <link rel="stylesheet" href="cart.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <a href="index.html" class="brand">
        BEQUEM SCRUBS
    </a>


    <nav>

        <a href="index.html">

        </a>

        <a href="shop.html">

        <a href="index.html#reviews">

        </a>

            CART <span id="cartCount">0</span>
        </a>

<section class="cart-page">

    <p class="number">
        04 / CART
    </p>


    <h1>
        YOUR<br>
        CART.
    </h1>


    <div id="cartContainer"></div>


    <!-- ================= SUMMARY ================= -->

    <section class="cart-summary"
             id="cartSummary">

        <div class="summary-line">

            <span>
                ITEMS
            </span>

            <strong id="summaryItems">
                0
            </strong>

        </div>


        <div class="summary-line">

            <span>
                SUBTOTAL
            </span>

            <strong id="summaryTotal">
                PRICE TO BE ADDED
            </strong>

        </div>


        <button class="checkout-button"
                id="checkoutButton">

            CHECKOUT →

        </button>

    </section>


    <!-- ================= EMPTY CART ================= -->

    <section class="empty-cart"
             id="emptyCart">

        <p>

            DISCOVER THE COLLECTION →
        </a>

    </section>

<!-- ================= JAVASCRIPT ================= -->

<script>


/* ==================================================
   ELEMENTS
================================================== */


const cartContainer =
    document.getElementById("cartContainer");


const cartCount =
    document.getElementById("cartCount");


const summaryItems =
    document.getElementById("summaryItems");


const summaryTotal =
    document.getElementById("summaryTotal");


const cartSummary =
    document.getElementById("cartSummary");


const emptyCart =
    document.getElementById("emptyCart");


const checkoutButton =
    document.getElementById("checkoutButton");


const reviewPopup =
    document.getElementById("reviewPopup");


const reviewYes =
    document.getElementById("reviewYes");


const reviewNo =
    document.getElementById("reviewNo");


const reviewClose =
    document.getElementById("reviewClose");


/* ==================================================
   GET CART
================================================== */


let cart =
    JSON.parse(
        localStorage.getItem("bequemCart") || "[]"
    );


/* ==================================================
   DISPLAY CART
================================================== */


function displayCart() {

    cartContainer.innerHTML = "";


    /*
     * EMPTY CART
     */

    if (cart.length === 0) {

        cartSummary.style.display = "none";

        emptyCart.style.display = "block";

        cartCount.textContent = "0";

        return;

    }


    /*
     * CART HAS PRODUCTS
     */

    cartSummary.style.display = "block";

    emptyCart.style.display = "none";


    let totalItems = 0;

    let totalPrice = 0;


    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;


        totalItems += quantity;


        const price =
            Number(
                String(item.price || "0")
                    .replace(/[^\d.]/g, "")
            ) || 0;


        totalPrice +=
            price * quantity;


        const cartItem =
            document.createElement("div");


        cartItem.className =
            "cart-item";


        cartItem.innerHTML = `

            <div class="cart-item-info">

                <h3>
                    ${item.name || "BEQUEM SCRUB"}
                </h3>

                ${
                    item.size
                    ? `<p>SIZE: ${item.size}</p>`
                    : ""
                }

                ${
                    item.color
                    ? `<p>COLOR: ${item.color}</p>`
                    : ""
                }

                <p>
                    QUANTITY: ${quantity}
                </p>

            </div>


            <div class="cart-item-price">

                ${item.price || "PRICE TO BE ADDED"}

            </div>

        `;


        cartContainer.appendChild(cartItem);

    });


    /*
     * UPDATE CART NUMBER
     */

    cartCount.textContent =
        totalItems;


    /*
     * UPDATE ITEMS
     */

    summaryItems.textContent =
        totalItems;


    /*
     * UPDATE PRICE
     */

    if (totalPrice > 0) {

        summaryTotal.textContent =
            totalPrice.toLocaleString() + " DA";

    } else {

        summaryTotal.textContent =
            "PRICE TO BE ADDED";

    }

}


/* ==================================================
   CHECKOUT
================================================== */


checkoutButton.addEventListener(
    "click",
    function() {


        /*
         * Don't checkout empty cart
         */

        if (cart.length === 0) {

            return;

        }


        /*
         * ==========================================
         * ORDER IS CONFIRMED
         * ==========================================
         */


        /*
         * Save order before clearing cart.
         *
         * This keeps a copy of the last order
         * in case you need it later.
         */

        localStorage.setItem(
            "bequemLastOrder",
            JSON.stringify(cart)
        );


        /*
         * EMPTY THE CART
         */

        cart = [];


        localStorage.setItem(
            "bequemCart",
            JSON.stringify([])
        );


        /*
         * UPDATE THE PAGE
         */

        displayCart();


        /*
         * SHOW REVIEW POPUP
         */

        reviewPopup.classList.add("active");

    }
);


/* ==================================================
   YES — GO TO REVIEWS
================================================== */


reviewYes.addEventListener(
    "click",
    function() {

        window.location.href =
            "reviews.html";

    }
);


/* ==================================================
   NO — CLOSE POPUP
================================================== */


reviewNo.addEventListener(
    "click",
    function() {

        reviewPopup.classList.remove(
            "active"
        );

    }
);


/* ==================================================
   CLOSE BUTTON
================================================== */


reviewClose.addEventListener(
    "click",
    function() {

        reviewPopup.classList.remove(
            "active"
        );

    }
);


/* ==================================================
   CLICK OUTSIDE POPUP
================================================== */


reviewPopup.addEventListener(
    "click",
    function(event) {

        if (
            event.target === reviewPopup
        ) {

            reviewPopup.classList.remove(
                "active"
            );

        }

    }
);


/* ==================================================
   START
================================================== */


displayCart();


</script>


</body>

</html>
