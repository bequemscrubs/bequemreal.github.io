<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout — BEQUEM SCRUBS</title>

    <link rel="stylesheet" href="checkout.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>

<header class="header">

    <a href="index.html" class="brand">
        BEQUEM SCRUBS
    </a>

    <nav>

        <a href="index.html" data-i18n="nav-home">HOME</a>

        <a href="shop.html" data-i18n="nav-shop">SHOP</a>

        <a href="cart.html" data-i18n="nav-cart">CART</a>

    </nav>

</header>


<main class="checkout-page">

    <p class="number" data-i18n="checkout-number">
        05 / CHECKOUT
    </p>

    <h1 data-i18n="checkout-title">
        YOUR<br>
        DETAILS.
    </h1>


    <form id="orderForm">


        <!-- ================= CUSTOMER ================= -->

        <section class="checkout-section">

            <p class="section-number" data-i18n="customer-section">
                01 / CUSTOMER
            </p>

            <h2 data-i18n="delivery-information">
                DELIVERY INFORMATION
            </h2>


            <div class="form-grid">

                <div class="field">

                    <label for="firstName" data-i18n="first-name-required">
                        FIRST NAME *
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        required
                        placeholder="Your first name" data-i18n-placeholder="first-name-placeholder">

                </div>


                <div class="field">

                    <label for="lastName" data-i18n="last-name-required">
                        LAST NAME *
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        required
                        placeholder="Your last name" data-i18n-placeholder="last-name-placeholder">

                </div>


                <div class="field">

                    <label for="phone" data-i18n="phone-required">
                        PHONE NUMBER *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                        placeholder="07 XX XX XX XX" data-i18n-placeholder="phone-placeholder">

                </div>


                <div class="field">

                    <label for="city" data-i18n="city-wilaya-required">
                        CITY / WILAYA *
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        required
                        placeholder="Your city / wilaya" data-i18n-placeholder="city-wilaya-placeholder">

                </div>


                <div class="field full">

                    <label for="address" data-i18n="delivery-address">
                        DELIVERY ADDRESS *
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        required
                        placeholder="Your complete delivery address" data-i18n-placeholder="address-placeholder"></textarea>

                </div>


                <div class="field full">

                    <label for="email" data-i18n="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Optional" data-i18n-placeholder="email-placeholder">

                </div>

            </div>

        </section>


        <!-- ================= ORDER ================= -->

        <section class="checkout-section">

            <p class="section-number" data-i18n="order-section">
                02 / ORDER
            </p>

            <h2 data-i18n="your-order">
                YOUR ORDER
            </h2>

            <div id="orderSummary"></div>

        </section>


        <!-- ================= TOTAL ================= -->

        <section class="checkout-total">

            <div>

                <span data-i18n="total">
                    TOTAL
                </span>

                <strong id="orderTotal">
                    PRICE TO BE ADDED
                </strong>

            </div>


            <button
                type="submit"
                class="place-order">

                PLACE ORDER →

            </button>

        </section>


    </form>

</main>


<footer>

    <div class="footer-brand">
        BEQUEM SCRUBS
    </div>

    <div class="footer-bottom">

        <span>
            MEDICAL WEAR • EST. 2026
        </span>

        <span>
            © 2026 BEQUEM SCRUBS
        </span>

    </div>

</footer>


<script src="checkout.js"></script>
<script src="translations.js"></script>
</body>

</html>
